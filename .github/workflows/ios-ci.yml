name: iOS CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  simulator-tests:
    name: TwentyNinerNext simulator tests
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODEGEN_VERSION: 2.45.4
      XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef

    steps:
      - name: Check out the pull request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Test NMP consumer-boundary diagnostics
        shell: bash
        run: swift test --package-path tools/NMPBoundaryLint

      - name: Enforce NMP consumer boundary
        shell: bash
        run: |
          set -euo pipefail
          swift run --package-path tools/NMPBoundaryLint nmp-boundary-lint \
            --root ios/Sources \
            --project ios/project.yml \
            --policy tools/NMPBoundaryLint/Policy/nmp-boundary.json \
            --repository-root . \
            --format github-actions

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$archive"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum --algorithm 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Record pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodegen --version

      # The iOS Rust targets are installed by scripts/bootstrap-nmp.sh, from
      # inside the NMP checkout, so NMP's own rust-toolchain.toml selects the
      # toolchain they land on. Installing them here instead would need this
      # workflow to name NMP's pinned channel, and a stale copy of that pin is
      # what silently removed this repo's NMP signal for four days (#135).
      - name: Bootstrap NMP master
        shell: bash
        run: scripts/bootstrap-nmp.sh

      - name: Generate Xcode project
        shell: bash
        run: scripts/generate-project.sh

      # Naming the destination by `name=iPhone 17 Pro,OS=26.5` got "no
      # available devices matched the request", with xcodebuild listing no
      # iOS simulator at all -- on a runner that has both. See
      # scripts/select-ios-simulator.sh for what that script does and why.
      - name: Select an iOS simulator
        id: simulator
        shell: bash
        run: echo "udid=$(scripts/select-ios-simulator.sh)" >> "$GITHUB_OUTPUT"

      - name: Run iOS simulator tests
        shell: bash
        run: |
          set -euo pipefail
          # No CODE_SIGNING_ALLOWED=NO. An unsigned simulator app has no
          # application-identifier entitlement, so every Keychain call in it
          # fails with errSecMissingEntitlement (-34018) -- which is why
          # VoiceProviderStoreTests could never pass here. Xcode signs a
          # simulator build ad-hoc with no team and no provisioning profile,
          # which is enough for the Keychain and costs nothing else.
          xcodebuild \
            -project ios/TwentyNinerNext.xcodeproj \
            -scheme TwentyNinerNext \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath ios/DerivedData \
            test
