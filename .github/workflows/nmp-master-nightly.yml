name: NMP master nightly

# Option C for staying aligned with NMP master: the app tracks NMP master (see
# scripts/bootstrap-nmp.sh), and this scheduled job rebuilds NMP master from scratch
# and runs the app's simulator tests every night. If NMP master lands a breaking API
# change, this catches it here — proactively, on a dedicated run — instead of red-lighting
# an unrelated PR or biting a developer with a stale local checkout. On failure it opens
# (or updates) a tracking issue so the break is actionable.
#
# The build/test steps intentionally mirror .github/workflows/ios-ci.yml so the nightly
# validates exactly what PR CI validates. Keep the two in sync when either changes.

on:
  schedule:
    # 08:00 UTC daily — after NMP's typical active hours, so it covers the prior day.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nmp-master-nightly
  cancel-in-progress: true

jobs:
  simulator-tests:
    name: TwentyNinerNext simulator tests (NMP master)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODEGEN_VERSION: 2.45.4
      XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef

    steps:
      - name: Check out main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$archive"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum --algorithm 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Record pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcodegen --version

      # The iOS Rust targets are installed by scripts/bootstrap-nmp.sh, from
      # inside the NMP checkout, so NMP's own rust-toolchain.toml selects the
      # toolchain they land on. Installing them here instead would need this
      # workflow to name NMP's pinned channel, and a stale copy of that pin is
      # what silently removed this repo's NMP signal for four days (#135).
      - name: Bootstrap NMP master
        shell: bash
        run: scripts/bootstrap-nmp.sh

      - name: Record NMP master commit
        shell: bash
        run: |
          set -euo pipefail
          echo "NMP master commit under test:"
          git -C Dependencies/nmp log -1 --format='%H %ci %s'

      - name: Generate Xcode project
        shell: bash
        run: scripts/generate-project.sh

      - name: Run iOS simulator tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/TwentyNinerNext.xcodeproj \
            -scheme TwentyNinerNext \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test

  notify-on-failure:
    name: Report the nightly failure
    needs: simulator-tests
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      # This job knows one thing: the nightly went red, and at which step. It
      # must not name a cause it has not established. Asserting "NMP landed a
      # breaking API change" cost this repo four days of misdirection while the
      # actual failure was a local toolchain/target misconfiguration in this
      # very workflow (#135) -- the report named a culprit in another repo, so
      # nobody looked here.
      - name: Report the failure on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          failed_steps=$(
            gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
              --jq '.jobs[] | select(.name | startswith("TwentyNinerNext"))
                    | .steps[] | select(.conclusion == "failure") | "- " + .name' \
              || true
          )
          [[ -n "$failed_steps" ]] || failed_steps="- (could not read the step list; see the run)"
          title="Nightly: app build against NMP master is red"
          body=$(printf 'The nightly run of the app against NMP master failed.\n\nFailing step(s):\n%s\n\nFailed run: %s\n\nThis reports **that** the nightly is red, not **why** — read the log before assigning a cause. The candidates, in the order they are cheapest to rule out:\n\n1. **This workflow.** It shares every build step with `.github/workflows/ios-ci.yml`. If PR CI is red on unrelated branches too, the fault is here or in `scripts/bootstrap-nmp.sh`, not in NMP.\n2. **The xcframework build** (`Dependencies/nmp/scripts/build-swift-xcframework.sh`). Rust compile errors, missing targets, or lipo/xcodebuild packaging failures land here.\n3. **An NMP API change.** Only this one shows up as Swift compile errors in `ios/Sources/`. `git -C Dependencies/nmp log` between the last green nightly and now identifies the change; fix the app or coordinate with NMP.\n4. **A genuine app test failure**, with NMP building fine.\n' "$failed_steps" "$RUN_URL")
          existing=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
